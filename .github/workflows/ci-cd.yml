# =============================================================================
# Smart City Analytics — GitHub Actions CI/CD Pipeline
# =============================================================================
# Triggers:
#   - Push to dev    → runs CI checks (lint, terraform plan)
#   - Push to main   → runs CD deployment (terraform apply, docker build)
# =============================================================================

name: Smart City Analytics CI/CD

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

env:
  PROJECT_ID:      smart-city-analytics
  REGION:          asia-south1
  REGISTRY:        asia-south1-docker.pkg.dev
  REPOSITORY:      smart-city-repo
  API_IMAGE:       smart-city-api
  CSV_IMAGE:       csv-loader

jobs:

  # ===========================================================================
  # JOB 1: Code Quality Checks
  # Runs on every push to dev and main
  # ===========================================================================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          pip install flake8 black

      - name: Run Black (code formatter check)
        run: |
          black --check --diff \
            ingestion/sensor_simulator/ \
            processing/cloud_run_jobs/ \
            serving/api/ \
            scripts/
        continue-on-error: true

      - name: Run Flake8 (code linter)
        run: |
          flake8 \
            ingestion/sensor_simulator/ \
            processing/cloud_run_jobs/ \
            serving/api/ \
            scripts/ \
            --max-line-length=100 \
            --exclude=venv,__pycache__
        continue-on-error: true

  # ===========================================================================
  # JOB 2: Terraform Plan (CI)
  # Runs on push to dev — shows what would change, does NOT apply
  # ===========================================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform Init
        working-directory: terraform/envs/dev
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform/envs/dev
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        working-directory: terraform/envs/dev
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform/envs/dev
        run: terraform plan -var-file="terraform.tfvars"
        env:
          TF_VAR_project_id: ${{ env.PROJECT_ID }}

  # ===========================================================================
  # JOB 3: Terraform Apply + Deploy (CD)
  # Runs ONLY on push to main (after PR merge)
  # ===========================================================================
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform Init
        working-directory: terraform/envs/dev
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/envs/dev
        run: terraform apply -auto-approve -var-file="terraform.tfvars"
        env:
          TF_VAR_project_id: ${{ env.PROJECT_ID }}

  # ===========================================================================
  # JOB 4: Build and Deploy API (CD)
  # Runs ONLY on push to main
  # ===========================================================================
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build API Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.API_IMAGE }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.API_IMAGE }}:latest \
            serving/api/

      - name: Push API Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.API_IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.API_IMAGE }}:latest

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy smart-city-api \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.API_IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --service-account=api-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --project=${{ env.PROJECT_ID }}

  # ===========================================================================
  # JOB 5: Build and Deploy CSV Loader (CD)
  # Runs ONLY on push to main
  # ===========================================================================
  deploy-csv-loader:
    name: Deploy CSV Loader
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build CSV Loader Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.CSV_IMAGE }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.CSV_IMAGE }}:latest \
            processing/cloud_run_jobs/csv_loader/

      - name: Push CSV Loader Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.CSV_IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.CSV_IMAGE }}:latest

      - name: Update Cloud Run Job
        run: |
          gcloud run jobs update csv-loader-job \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.CSV_IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}